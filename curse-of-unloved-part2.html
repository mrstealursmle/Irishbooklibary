<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Curse of the Unloved: Part II — Written by Irish</title>

  <!-- Literary Book Typography, Antique Foil Cover Serif & Signature Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=La+Belle+Aurore&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       1. Design Tokens, Viewport-Locked 5:8 Book Geometry & Reading Desk Themes
       ========================================================================= */
    :root {
      /* Warm Dusky-Rosewood Literary Reading Desk (Default) */
      --desk-bg: radial-gradient(circle at 50% 24%, #e5d8d3 0%, #cdbcb6 58%, #b29e98 100%);
      --paper-cream: #f5efe6;
      --ink-primary: #251d1b;
      --ink-soft: #564a46;
      --ink-muted: #82736e;
      --crimson-ink: #7d192b;
      --crimson-soft: #9c2b3e;
      --gold-foil: #dfbf8a;
      --gold-muted: #b8945e;
      --book-shadow: 0 28px 66px rgba(34, 16, 20, 0.34), 0 10px 22px rgba(34, 16, 20, 0.20);
      --ui-surface: rgba(247, 241, 236, 0.90);
      --ui-border: rgba(105, 58, 66, 0.20);
      --ui-text: #38272a;

      /* Strict 5:8 Trade Book Ratio (Single Page / Front Cover / Back Cover)
         Always clears top floating toolbar and bottom pagination pill cleanly */
      --page-h: min(calc(100vh - 156px), calc(92vw / 0.625), 680px);
      --page-h: min(calc(100dvh - 156px), calc(92vw / 0.625), 680px);
      --page-w: calc(var(--page-h) * 0.625);
    }

    /* Desktop Two-Page Open Spread Sizing (> 900px) */
    @media (min-width: 901px) {
      .book-stage.is-spread {
        --page-h: min(calc(100vh - 156px), calc(92vw / 1.25), 660px);
        --page-h: min(calc(100dvh - 156px), calc(92vw / 1.25), 660px);
        --page-w: calc(var(--page-h) * 0.625);
      }
    }

    /* Candlelit Midnight Velvet Reading Mode */
    body.night-mode {
      --desk-bg: radial-gradient(circle at 50% 22%, #2b141a 0%, #190b0f 62%, #0e0508 100%);
      --ui-surface: rgba(33, 15, 20, 0.90);
      --ui-border: rgba(223, 191, 138, 0.22);
      --ui-text: #eee1d6;
      --book-shadow: 0 34px 80px rgba(0, 0, 0, 0.72), 0 12px 28px rgba(0, 0, 0, 0.50);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'EB Garamond', Georgia, serif;
      background: var(--desk-bg);
      color: var(--ink-primary);
      overflow-x: hidden;
      transition: background 0.45s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle tactile desk weave pattern */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(68, 30, 36, 0.04) 1px, transparent 0);
      background-size: 24px 24px;
      z-index: 0;
    }

    /* Subtle Slow-Drifting Candlelit Gold Dust & Warm Ash Embers Layer */
    #emberCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* =========================================================================
       2. Floating Top Frosted-Glass Reading Toolbar
       ========================================================================= */
    .toolbar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--ui-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--ui-border);
      box-shadow: 0 8px 26px rgba(34, 16, 20, 0.14);
      max-width: calc(100vw - 20px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }

    .tool-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ui-text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tool-btn:hover { background: rgba(125, 25, 43, 0.12); }
    .tool-btn.active { background: var(--crimson-ink); color: #f8f1eb; }
    .tool-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    .tool-divider {
      width: 1px;
      height: 18px;
      background: var(--ui-border);
      flex-shrink: 0;
      margin: 0 2px;
    }

    @media (max-width: 900px) {
      #btnViewMode { display: none; }
    }

    /* =========================================================================
       3. Main Physical Book Stage (Guaranteed Clear of Toolbar & Bottom Pill)
       ========================================================================= */
    .stage {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 72px 16px 78px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .book-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2000px;
      max-width: 100%;
    }

    .book-stage {
      position: relative;
      display: flex;
      align-items: stretch;
      justify-content: center;
      border-radius: 4px;
      box-shadow: var(--book-shadow);
      transition: opacity 0.22s ease, transform 0.24s ease;
    }
    .book-stage.turning-next { opacity: 0.36; transform: translateX(-14px) scale(0.992); }
    .book-stage.turning-prev { opacity: 0.36; transform: translateX(14px) scale(0.992); }

    /* Locked 5:8 Book Page Container — Zero Aspect Distortion */
    .book-page {
      position: relative;
      width: var(--page-w);
      height: var(--page-h);
      flex: 0 0 auto;
      background: var(--paper-cream);
      overflow: hidden;
      user-select: text;
      display: flex;
      flex-direction: column;
    }

    /* Archival Cream Paper Grain SVG Overlay */
    .book-page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.34;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.14'/%3E%3C/svg%3E");
      z-index: 20;
      mix-blend-mode: multiply;
    }

    /* Realistic Book Thickness, Inner Spine Shadows & Stacked Page Edges */
    .book-page.single-page {
      border-radius: 3px 10px 10px 3px;
      box-shadow:
        inset 16px 0 24px -16px rgba(45, 30, 26, 0.34),
        inset 3px 0 6px -2px rgba(45, 30, 26, 0.24),
        inset -2px 0 5px rgba(255, 255, 255, 0.45),
        4px 0 0 -1px #ebe3d6, 7px 0 0 -2px #dfd6c7, 10px 0 0 -3px #d2c8b8, 13px 0 0 -4px #c7bcab;
    }

    .book-page.spread-left {
      border-radius: 8px 0 0 8px;
      box-shadow:
        inset -28px 0 36px -18px rgba(42, 26, 22, 0.36),
        inset -4px 0 8px -3px rgba(42, 26, 22, 0.26),
        -4px 0 0 -1px #ebe3d6, -7px 0 0 -2px #ded5c6, -10px 0 0 -3px #cfc5b5;
      border-right: 1px solid rgba(60, 40, 38, 0.16);
    }

    .book-page.spread-right {
      border-radius: 0 8px 8px 0;
      box-shadow:
        inset 28px 0 36px -18px rgba(42, 26, 22, 0.34),
        inset 4px 0 8px -3px rgba(42, 26, 22, 0.24),
        4px 0 0 -1px #ebe3d6, 7px 0 0 -2px #ded5c6, 10px 0 0 -3px #cfc5b5;
    }

    /* Collector's Matte Velvet-Oxblood Linen Front & Back Covers */
    .book-page.cover-front {
      background:
        radial-gradient(circle at 52% 44%, rgba(102, 18, 36, 0.40) 0%, rgba(30, 7, 14, 0.90) 60%, #18060b 100%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.018) 0px, rgba(255, 255, 255, 0.018) 1px, transparent 1px, transparent 3px),
        #18060b;
      border-radius: 3px 10px 10px 3px;
      box-shadow:
        inset 14px 0 22px -10px rgba(0, 0, 0, 0.72),
        inset 22px 0 2px -20px rgba(235, 206, 158, 0.28),
        inset 24px 0 4px -21px rgba(0, 0, 0, 0.58),
        inset -1px 0 3px rgba(235, 206, 158, 0.16),
        5px 0 0 -1px #f0e8dc, 8px 0 0 -2px #e2d8ca, 11px 0 0 -3px #d5cabe, 14px 0 0 -4px #c7bba9;
    }

    .book-page.cover-back {
      background:
        radial-gradient(circle at 48% 46%, rgba(92, 16, 33, 0.36) 0%, rgba(28, 7, 13, 0.92) 62%, #18060b 100%),
        repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.018) 0px, rgba(255, 255, 255, 0.018) 1px, transparent 1px, transparent 3px),
        #18060b;
      border-radius: 10px 3px 3px 10px;
      box-shadow:
        inset -14px 0 22px -10px rgba(0, 0, 0, 0.72),
        inset -22px 0 2px -20px rgba(235, 206, 158, 0.28),
        inset -24px 0 4px -21px rgba(0, 0, 0, 0.58),
        inset 1px 0 3px rgba(235, 206, 158, 0.16),
        -5px 0 0 -1px #f0e8dc, -8px 0 0 -2px #e2d8ca, -11px 0 0 -3px #d5cabe, -14px 0 0 -4px #c7bba9;
    }

    /* Matte Linen Cover Hinge Groove */
    .cover-front::after, .cover-back::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      pointer-events: none;
      z-index: 15;
    }
    .cover-front::after {
      left: 3.8%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.55), rgba(232, 202, 156, 0.24));
    }
    .cover-back::after {
      right: 3.8%;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.55), rgba(232, 202, 156, 0.24));
    }

    /* Embossed Shimmering Antique Gold Foil */
    .foil-title {
      background: linear-gradient(
        135deg,
        #b89158 0%,
        #f7e2bc 30%,
        #cfa668 54%,
        #fff2d6 78%,
        #9e753e 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.65));
      animation: goldShift 11s ease-in-out infinite;
    }

    @keyframes goldShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* =========================================================================
       4. Front Cover Full-Frame Layout (Doorway Engraving + Part II Gold Badge)
       ========================================================================= */
    .front-cover-inner {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 6.0% 8% 5.4% 10%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 1.0%;
      z-index: 5;
      overflow: hidden;
    }

    /* Double Hairline Antique Gold Collector's Frame */
    .cover-gold-border {
      position: absolute;
      inset: 3.6% 4.8% 3.6% 7%;
      border: 1px solid rgba(223, 191, 138, 0.36);
      pointer-events: none;
      z-index: 2;
    }
    .cover-gold-border::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 0.5px solid rgba(223, 191, 138, 0.18);
    }
    .cover-back .cover-gold-border {
      inset: 3.6% 7% 3.6% 4.8%;
    }

    .cover-top-kicker {
      flex: 0 0 auto;
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--page-h) * 0.0132);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(223, 191, 138, 0.80);
      text-align: center;
      padding-top: 1.0%;
      z-index: 8;
    }

    .cover-title-block {
      flex: 0 0 auto;
      width: 100%;
      text-align: center;
      z-index: 8;
      padding: 0 2%;
    }

    .cover-title-serif {
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--page-h) * 0.0425);
      line-height: 1.10;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .cover-title-line { display: block; }
    .cover-title-line.is-connector {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      text-transform: lowercase;
      font-size: 0.72em;
      letter-spacing: 0.09em;
      line-height: 0.94;
      opacity: 0.94;
      margin: calc(var(--page-h) * 0.002) 0;
    }

    /* Refined Antique Gold Foil "PART II" Badge Flanked by Delicate Hairline Rules */
    .cover-part-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--page-h) * 0.015);
      margin-top: calc(var(--page-h) * 0.011);
    }
    .cover-part-rule {
      width: calc(var(--page-h) * 0.052);
      height: 0.8px;
      background: linear-gradient(to right, transparent, rgba(223, 191, 138, 0.75), rgba(223, 191, 138, 0.45));
    }
    .cover-part-rule.right {
      background: linear-gradient(to left, transparent, rgba(223, 191, 138, 0.75), rgba(223, 191, 138, 0.45));
    }
    .cover-part-label {
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--page-h) * 0.0185);
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      padding-left: 0.34em;
    }

    .cover-subtitle-whisper {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: calc(var(--page-h) * 0.0182);
      line-height: 1.40;
      color: rgba(236, 214, 206, 0.82);
      max-width: 88%;
      margin: calc(var(--page-h) * 0.009) auto 0;
    }

    /* Hero Midnight Doorway & Table Lamp Engraving Container */
    .cover-art-wrap {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5% 4%;
      z-index: 6;
    }

    .cover-art-svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    /* Very Subtle Breathing Lamplight Warmth Pulse inside Cover Doorway */
    .lamp-glow-pulse {
      animation: lampBreath 7.5s ease-in-out infinite;
      transform-origin: 140px 168px;
    }
    @keyframes lampBreath {
      0%, 100% { opacity: 0.82; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    .cover-author-block {
      flex: 0 0 auto;
      text-align: center;
      z-index: 8;
      padding-bottom: 0.8%;
    }
    .cover-gold-rule {
      width: calc(var(--page-h) * 0.072);
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(223, 191, 138, 0.65), transparent);
      margin: 0 auto calc(var(--page-h) * 0.010);
    }
    .cover-author {
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--page-h) * 0.0188);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #e9d1a6;
      font-weight: 500;
      line-height: 1.25;
    }

    /* =========================================================================
       5. Back Cover Full-Frame Layout & Circular Book II Ex-Libris Seal
       ========================================================================= */
    .back-cover-inner {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 7.0% 10.5% 5.6% 9.2%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 5;
      color: #e9dbd4;
      overflow: hidden;
    }

    .back-top-section {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .back-top-ornament {
      display: flex;
      justify-content: center;
      margin-bottom: calc(var(--page-h) * 0.014);
      opacity: 0.88;
    }
    .back-top-ornament svg {
      height: calc(var(--page-h) * 0.032);
      width: auto;
      display: block;
    }

    .back-quote {
      font-style: italic;
      font-size: calc(var(--page-h) * 0.0220);
      line-height: 1.52;
      text-align: center;
      color: #f3e4d7;
      margin-bottom: calc(var(--page-h) * 0.016);
    }

    .back-divider {
      width: calc(var(--page-h) * 0.068);
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(223, 191, 138, 0.55), transparent);
      margin: 0 auto calc(var(--page-h) * 0.016);
      flex-shrink: 0;
    }

    .back-blurb {
      font-size: calc(var(--page-h) * 0.0178);
      line-height: 1.55;
      text-align: center;
      color: rgba(231, 212, 204, 0.87);
      margin-bottom: calc(var(--page-h) * 0.013);
    }
    .back-blurb:last-child { margin-bottom: 0; }

    .back-bottom-section {
      flex: 0 0 auto;
      margin-top: calc(var(--page-h) * 0.012);
    }

    .back-author-note {
      font-family: 'Cormorant Garamond', serif;
      font-size: calc(var(--page-h) * 0.0172);
      line-height: 1.42;
      text-align: center;
      color: rgba(224, 201, 192, 0.84);
      border-top: 1px solid rgba(223, 191, 138, 0.20);
      padding-top: calc(var(--page-h) * 0.012);
      margin-bottom: calc(var(--page-h) * 0.014);
    }
    .back-author-note strong {
      font-family: 'Cinzel', Georgia, serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.88em;
      color: #e7cb9a;
      display: block;
      margin-bottom: calc(var(--page-h) * 0.004);
    }

    .back-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4%;
    }

    .back-manuscript-meta {
      font-family: 'Cormorant Garamond', serif;
      font-size: calc(var(--page-h) * 0.0134);
      line-height: 1.52;
      color: rgba(220, 198, 189, 0.78);
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }
    .back-manuscript-meta .ms-heading {
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 500;
      color: #e3c48f;
      font-size: calc(var(--page-h) * 0.0138);
      letter-spacing: 0.15em;
      display: block;
      margin-bottom: calc(var(--page-h) * 0.003);
    }

    .archival-seal-wrap {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.94;
      transform: rotate(-5deg);
    }
    .archival-seal-svg {
      width: calc(var(--page-h) * 0.126);
      height: calc(var(--page-h) * 0.126);
      display: block;
    }

    /* =========================================================================
       6. Interior Archival Cream Pages, Asymmetric Gutters & Ghost Bleed-Through
       ========================================================================= */
    .page-inner {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding: 7.8% 12.5% 6.8% 13.5%;
      display: flex;
      flex-direction: column;
      color: var(--ink-primary);
      overflow: hidden;
    }

    /* Asymmetric Perfect-Binding Gutter Margins (16.5% spine / 11.5% outer) */
    .book-page.spread-left .page-inner,
    .page-inner.verso-gutter {
      padding-left: 11.5%;
      padding-right: 16.5%;
    }

    .book-page.spread-right .page-inner,
    .page-inner.recto-gutter {
      padding-left: 16.5%;
      padding-right: 11.5%;
    }

    /* Authentic Subtle Mirrored Ink Bleed-Through on Poem Pages */
    .ghost-bleed {
      position: absolute;
      inset: 14% 15%;
      transform: scaleX(-1);
      opacity: 0.030;
      color: #2b1a1c;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: calc(var(--page-h) * 0.023);
      line-height: 1.68;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: left;
      filter: blur(0.4px);
      z-index: 1;
      user-select: none;
    }

    /* Chicago-style Small-Caps Running Header */
    .running-header {
      position: relative;
      z-index: 4;
      font-family: 'Cormorant Garamond', serif;
      font-size: calc(var(--page-h) * 0.0140);
      font-weight: 500;
      letter-spacing: 0.19em;
      text-transform: uppercase;
      color: var(--ink-muted);
      opacity: 0.82;
      text-align: center;
      padding-bottom: calc(var(--page-h) * 0.012);
      margin-bottom: calc(var(--page-h) * 0.004);
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-footer-num {
      position: relative;
      z-index: 4;
      margin-top: auto;
      text-align: center;
      font-size: calc(var(--page-h) * 0.0172);
      color: var(--ink-muted);
      letter-spacing: 0.07em;
      padding-top: calc(var(--page-h) * 0.012);
      flex-shrink: 0;
    }

    /* Rich Warm Archival Endpapers */
    .endpaper-inner {
      background: linear-gradient(135deg, #ece3d7 0%, #e5d8cb 100%);
      width: 100%;
      height: 100%;
    }

    .half-title-wrap, .dedication-wrap, .part-opener-wrap {
      position: relative;
      z-index: 4;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-bottom: 8%;
    }

    .half-title-text {
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--page-h) * 0.0265);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #362226;
      line-height: 1.42;
      max-width: 92%;
    }

    .full-title-wrap {
      position: relative;
      z-index: 4;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: 9% 2% 4%;
    }

    .full-title-main {
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--page-h) * 0.0345);
      line-height: 1.22;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: #4f1420;
      margin-bottom: calc(var(--page-h) * 0.014);
    }

    .full-title-sub {
      font-style: italic;
      font-size: calc(var(--page-h) * 0.0200);
      color: var(--ink-soft);
      max-width: 92%;
      margin: 0 auto;
      line-height: 1.48;
    }

    .full-title-sprig svg {
      height: calc(var(--page-h) * 0.056);
      width: auto;
      display: block;
    }

    .full-title-author {
      font-family: 'Cormorant Garamond', serif;
      font-size: calc(var(--page-h) * 0.022);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #3a272a;
    }

    /* Private Written Mark at Foot of Title Page (No Publisher) */
    .full-title-manuscript-mark {
      font-family: 'Cormorant Garamond', serif;
      text-align: center;
      color: var(--ink-muted);
      line-height: 1.55;
      border-top: 1px solid rgba(125, 25, 43, 0.28);
      padding-top: calc(var(--page-h) * 0.012);
      width: 84%;
    }
    .full-title-manuscript-mark .ms-mark-top {
      display: block;
      font-size: calc(var(--page-h) * 0.0148);
      font-weight: 600;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--crimson-ink);
    }
    .full-title-manuscript-mark .ms-mark-sub {
      display: block;
      font-size: calc(var(--page-h) * 0.0132);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .copyright-wrap {
      position: relative;
      z-index: 4;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 3%;
      font-size: calc(var(--page-h) * 0.0165);
      line-height: 1.58;
      color: #5c4f4b;
    }
    .copyright-wrap p { margin-bottom: calc(var(--page-h) * 0.012); }
    .copyright-title { font-style: italic; color: #352325; font-size: 1.1em; }
    .copyright-kicker {
      font-family: 'Cormorant Garamond', serif;
      font-size: calc(var(--page-h) * 0.0145);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--crimson-ink);
      font-weight: 600;
      margin-bottom: calc(var(--page-h) * 0.014);
    }

    .dedication-text {
      font-style: italic;
      font-size: calc(var(--page-h) * 0.0242);
      line-height: 1.78;
      color: #362527;
      max-width: 92%;
    }

    .epigraph-author {
      margin-top: calc(var(--page-h) * 0.022);
      font-family: 'Cormorant Garamond', serif;
      font-size: calc(var(--page-h) * 0.0185);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* Interactive Table of Contents */
    .toc-wrap {
      position: relative;
      z-index: 40;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .toc-heading {
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--page-h) * 0.0248);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-align: center;
      color: #3c1f25;
      margin-bottom: calc(var(--page-h) * 0.024);
    }
    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: calc(var(--page-h) * 0.012);
    }
    .toc-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      cursor: pointer;
      padding: calc(var(--page-h) * 0.005) calc(var(--page-h) * 0.007);
      border-radius: 4px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .toc-item:hover { background: rgba(125, 25, 43, 0.08); transform: translateX(3px); }
    .toc-part-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: calc(var(--page-h) * 0.0140);
      letter-spacing: 0.15em;
      color: var(--crimson-ink);
      text-transform: uppercase;
      display: block;
      line-height: 1.1;
      margin-bottom: 2px;
    }
    .toc-part-title {
      font-size: calc(var(--page-h) * 0.0212);
      font-style: italic;
      color: #2d2224;
      line-height: 1.24;
    }
    .toc-dots {
      flex: 1;
      border-bottom: 1px dotted rgba(105, 72, 76, 0.35);
      margin: 0 calc(var(--page-h) * 0.012);
      transform: translateY(-3px);
    }
    .toc-pg {
      font-size: calc(var(--page-h) * 0.0188);
      color: var(--ink-soft);
    }

    /* Part Opener Styling */
    .part-sketch {
      margin-bottom: calc(var(--page-h) * 0.024);
      opacity: 0.90;
    }
    .part-sketch svg {
      height: calc(var(--page-h) * 0.120);
      width: auto;
      display: block;
      margin: 0 auto;
    }
    .part-roman {
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--page-h) * 0.0162);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--crimson-ink);
      margin-bottom: calc(var(--page-h) * 0.012);
    }
    .part-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: calc(var(--page-h) * 0.039);
      font-weight: 400;
      font-style: italic;
      color: #2c1e20;
      line-height: 1.18;
      margin-bottom: calc(var(--page-h) * 0.016);
      max-width: 92%;
    }
    .part-sub {
      font-size: calc(var(--page-h) * 0.0205);
      color: var(--ink-muted);
      font-style: italic;
      max-width: 86%;
      line-height: 1.50;
    }

    /* Poem Template (Proportioned for Clean Zero-Overflow Literary Margins) */
    .poem-wrap {
      position: relative;
      z-index: 4;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 1% 4% 2%;
    }
    .poem-body {
      font-size: calc(var(--page-h) * 0.0230);
      line-height: 1.64;
      color: #241b1c;
      white-space: pre-line;
    }
    .poem-title-tag {
      margin-top: calc(var(--page-h) * 0.024);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: calc(var(--page-h) * 0.0195);
      color: #84454f;
      letter-spacing: 0.04em;
    }

    /* Short Lyrical Prose Template with Crimson-Ink Drop Cap */
    .prose-wrap {
      position: relative;
      z-index: 4;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 1% 3%;
    }
    .prose-heading {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: calc(var(--page-h) * 0.0285);
      font-weight: 500;
      color: #3c1f24;
      margin-bottom: calc(var(--page-h) * 0.018);
      line-height: 1.24;
    }
    .prose-text {
      font-size: calc(var(--page-h) * 0.0210);
      line-height: 1.68;
      color: #2a2021;
      text-align: left;
    }
    .prose-text p + p {
      margin-top: calc(var(--page-h) * 0.015);
      text-indent: 1.3em;
    }
    .prose-text.has-dropcap p:first-of-type::first-letter {
      font-family: 'Cormorant Garamond', Georgia, serif;
      float: left;
      font-size: 3em;
      line-height: 0.82;
      padding-right: 0.18em;
      padding-top: 0.06em;
      color: var(--crimson-ink);
      font-weight: 500;
    }
    .prose-sign {
      margin-top: calc(var(--page-h) * 0.022);
      font-family: 'La Belle Aurore', cursive;
      font-size: calc(var(--page-h) * 0.036);
      color: var(--crimson-ink);
    }
    .poem-tiny-ornament {
      margin-top: calc(var(--page-h) * 0.020);
      opacity: 0.65;
    }
    .poem-tiny-ornament svg {
      height: calc(var(--page-h) * 0.032);
      width: auto;
      display: block;
    }

    /* Clickable Quotes Index ("Lines Kept in the Margin") */
    .margin-index-wrap {
      position: relative;
      z-index: 40;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .margin-heading {
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--page-h) * 0.0205);
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      color: #3c1f25;
      margin-bottom: calc(var(--page-h) * 0.018);
    }
    .margin-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: calc(var(--page-h) * 0.012);
    }
    .margin-item {
      cursor: pointer;
      padding: calc(var(--page-h) * 0.005) calc(var(--page-h) * 0.010);
      border-left: 1.5px solid rgba(125, 25, 43, 0.34);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .margin-item:hover {
      background: rgba(125, 25, 43, 0.07);
      border-left-color: var(--crimson-ink);
    }
    .margin-line {
      font-style: italic;
      font-size: calc(var(--page-h) * 0.0168);
      line-height: 1.38;
      color: #2f2224;
      display: block;
    }
    .margin-meta {
      font-family: 'Cormorant Garamond', serif;
      font-size: calc(var(--page-h) * 0.0138);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: calc(var(--page-h) * 0.003);
      display: flex;
      justify-content: space-between;
    }

    /* About the Author & Colophon */
    .about-wrap {
      position: relative;
      z-index: 4;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 2% 5%;
    }
    .about-heading {
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--page-h) * 0.0235);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #3c1f24;
      margin-bottom: calc(var(--page-h) * 0.020);
      text-align: center;
    }
    .about-monogram {
      width: calc(var(--page-h) * 0.078);
      height: calc(var(--page-h) * 0.078);
      border-radius: 50%;
      border: 1px solid rgba(125, 25, 43, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto calc(var(--page-h) * 0.020);
      font-family: 'La Belle Aurore', cursive;
      font-size: calc(var(--page-h) * 0.038);
      color: var(--crimson-ink);
      background: rgba(125, 25, 43, 0.05);
    }
    .about-text {
      font-size: calc(var(--page-h) * 0.0212);
      line-height: 1.7;
      color: #362628;
      text-align: center;
    }
    .about-text p + p { margin-top: calc(var(--page-h) * 0.016); }

    .colophon-wrap {
      position: relative;
      z-index: 4;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      padding-bottom: 8%;
      font-size: calc(var(--page-h) * 0.0166);
      line-height: 1.68;
      color: var(--ink-muted);
      font-style: italic;
    }
    .colophon-sprig svg {
      height: calc(var(--page-h) * 0.038);
      width: auto;
      display: block;
    }

    /* Invisible Edge Click Zones for Natural Page Turning */
    .flip-zone {
      position: absolute;
      top: 0; bottom: 0;
      width: 15%;
      z-index: 30;
      cursor: pointer;
    }
    .flip-zone.left { left: 0; }
    .flip-zone.right { right: 0; }

    /* =========================================================================
       7. Bottom Pagination Pill
       ========================================================================= */
    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--ui-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--ui-border);
      box-shadow: 0 8px 26px rgba(34, 16, 20, 0.16);
    }

    .nav-arrow {
      appearance: none;
      border: 1px solid var(--ui-border);
      background: transparent;
      color: var(--ui-text);
      width: 34px; height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s ease;
    }
    .nav-arrow:hover:not(:disabled) {
      background: var(--crimson-ink);
      color: #f8f1eb;
      border-color: var(--crimson-ink);
    }
    .nav-arrow:disabled { opacity: 0.32; cursor: not-allowed; }

    .page-indicator {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--ui-text);
      min-width: 146px;
      text-align: center;
      letter-spacing: 0.04em;
    }

    /* =========================================================================
       8. Slide-Out Chapter & Section Index Drawer
       ========================================================================= */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 10, 13, 0.50);
      backdrop-filter: blur(3px);
      z-index: 180;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .chapter-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(340px, 88vw);
      background: #f6f0e8;
      color: #2c2022;
      z-index: 190;
      box-shadow: 18px 0 48px rgba(24, 10, 14, 0.32);
      transform: translateX(-102%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(125, 25, 43, 0.16);
    }
    .chapter-drawer.open { transform: translateX(0); }

    .drawer-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(125, 25, 43, 0.14);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-title {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #3d1c23;
    }
    .drawer-close {
      border: none;
      background: rgba(125, 25, 43, 0.10);
      color: #3d1c23;
      width: 30px; height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 24px;
    }
    .drawer-group-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      padding: 10px 8px 6px;
    }
    .drawer-item {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      color: #2e2123;
      transition: background 0.18s ease;
      font-family: 'EB Garamond', serif;
    }
    .drawer-item:hover { background: rgba(125, 25, 43, 0.09); }
    .drawer-item.active {
      background: rgba(125, 25, 43, 0.14);
      font-weight: 500;
    }
    .drawer-item-title { font-size: 15.5px; display: block; }
    .drawer-item-sub {
      font-size: 12px;
      font-style: italic;
      color: #6b585c;
      display: block;
    }
    .drawer-item-pg {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12.5px;
      color: var(--crimson-ink);
      font-weight: 600;
      flex-shrink: 0;
    }

    /* =========================================================================
       9. Shared Modal Styles (Customize + Full-Wrap Cover Inspector)
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 9, 12, 0.66);
      backdrop-filter: blur(5px);
      z-index: 210;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }

    .modal-card {
      background: #f7f1ea;
      color: #2c2022;
      width: 100%;
      max-width: 450px;
      max-height: 92dvh;
      overflow-y: auto;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(125, 25, 43, 0.18);
    }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 600; margin-bottom: 4px; color: #36191f; }
    .modal-desc { font-size: 14px; color: #68585b; margin-bottom: 14px; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .field-row { grid-template-columns: 1fr; }
    }
    .field-group { margin-bottom: 10px; }
    .field-group label {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #544145;
      margin-bottom: 4px;
    }
    .field-group input, .field-group textarea {
      width: 100%;
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid rgba(125, 25, 43, 0.25);
      background: #fdfaf6;
      font-family: 'EB Garamond', serif;
      font-size: 15px;
      color: #261d1f;
      outline: none;
    }
    .field-group input:focus, .field-group textarea:focus { border-color: var(--crimson-ink); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn-secondary, .btn-primary {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14.5px;
      font-weight: 600;
      padding: 7px 17px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
    }
    .btn-secondary { background: rgba(105, 65, 72, 0.12); color: #3e2a2e; }
    .btn-primary { background: var(--crimson-ink); color: #f8f2ec; }

    /* =========================================================================
       10. Full-Wrap Archival Cover Inspector (Back + Spine + Front + Bleed Guides)
       ========================================================================= */
    .wrap-modal-card {
      background: #f5eee7;
      color: #2c2022;
      width: min(92vw, 960px);
      max-height: 92vh;
      max-height: 92dvh;
      border-radius: 16px;
      padding: 16px 18px 16px;
      box-shadow: 0 28px 75px rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(125, 25, 43, 0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .wrap-header {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(125, 25, 43, 0.15);
    }
    .wrap-specs {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12.5px;
      color: #635356;
      letter-spacing: 0.03em;
    }
    .wrap-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .bleed-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 600;
      color: #3e282c;
      background: rgba(125, 25, 43, 0.10);
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
    }
    .bleed-toggle input { accent-color: var(--crimson-ink); cursor: pointer; }

    .wrap-viewport {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-height: 70vh;
      max-height: 70dvh;
      padding: 14px;
      background: #d5c5bf;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      --wrap-max-w: min(880px, calc(92vw - 68px));
      --wrap-h: min(calc(64vh - 28px), 560px, calc(var(--wrap-max-w) / 1.257));
      --wrap-h: min(calc(64dvh - 28px), 560px, calc(var(--wrap-max-w) / 1.257));
      --wrap-w: calc(var(--wrap-h) * 1.257);
    }

    .full-wrap-sheet {
      position: relative;
      display: flex;
      align-items: stretch;
      width: var(--wrap-w);
      height: var(--wrap-h);
      flex: 0 0 auto;
      background: radial-gradient(circle at 50% 45%, #2b0a14 0%, #18060b 65%, #0e0306 100%);
      box-shadow: 0 16px 38px rgba(24, 9, 13, 0.42);
      overflow: hidden;

      --page-h: calc(var(--wrap-h) * 0.9697);
      --page-w: calc(var(--page-h) * 0.625);
    }

    .wrap-panel-back, .wrap-panel-front {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .wrap-panel-spine {
      flex: 0 0 3.4%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.42), rgba(223, 191, 138, 0.12) 24%, rgba(255, 255, 255, 0.04) 76%, rgba(0, 0, 0, 0.45));
      border-left: 1px solid rgba(223, 191, 138, 0.22);
      border-right: 1px solid rgba(223, 191, 138, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4.5% 0;
      position: relative;
      z-index: 6;
      overflow: hidden;
    }
    .spine-title {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: 'Cinzel', Georgia, serif;
      font-size: calc(var(--wrap-h) * 0.0175);
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #e7c995;
      white-space: nowrap;
    }
    .spine-author {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: 'Cormorant Garamond', serif;
      font-size: calc(var(--wrap-h) * 0.0165);
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #d6b6ac;
      white-space: nowrap;
    }
    .spine-sprig {
      opacity: 0.88;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spine-sprig svg {
      width: calc(var(--wrap-h) * 0.023);
      height: auto;
      display: block;
    }

    /* Prepress 0.125" Trim, Safe-Zone & Spine Fold Guides */
    .bleed-guides-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      display: none;
    }
    .full-wrap-sheet.show-guides .bleed-guides-overlay { display: block; }
    .guide-trim-box {
      position: absolute;
      top: 1.52%; bottom: 1.52%; left: 1.2%; right: 1.2%;
      border: 1.5px dashed #ff5c8a;
    }
    .guide-safe-left {
      position: absolute;
      top: 4.5%; bottom: 4.5%; left: 3.6%; right: 54%;
      border: 1px dotted #74c0fc;
    }
    .guide-safe-right {
      position: absolute;
      top: 4.5%; bottom: 4.5%; left: 54%; right: 3.6%;
      border: 1px dotted #74c0fc;
    }
    .guide-spine-fold {
      position: absolute;
      top: 0; bottom: 0; left: 48.3%; right: 48.3%;
      border-left: 1.2px dashed #69db7c;
      border-right: 1.2px dashed #69db7c;
    }
    .guide-badge {
      position: absolute;
      font-family: 'Courier New', monospace;
      font-size: max(7px, calc(var(--wrap-h) * 0.016));
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(18, 6, 10, 0.90);
      line-height: 1.2;
    }
    .guide-badge.trim { top: 2.2%; left: 1.8%; color: #ff85a8; }
    .guide-badge.safe { top: 5.2%; right: 4.2%; color: #a5d8ff; }
    .guide-badge.spine { bottom: 2.2%; left: 50%; transform: translateX(-50%); color: #8ce99a; white-space: nowrap; }

    .wrap-legend {
      flex: 0 0 auto;
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12.5px;
      color: #5b4a4d;
    }
    .legend-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: middle;
    }

    /* =========================================================================
       11. Dedicated 5x8 Trade Book Print / Save as PDF Export Styles
       ========================================================================= */
    #printBookContainer { display: none; }

    @media print {
      @page { size: 5in 8in; margin: 0; }
      :root, #printBookContainer, #printBookContainer .book-page {
        --page-h: 8in !important;
        --page-w: 5in !important;
      }
      body {
        background: #fff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body::before, #emberCanvas, .toolbar, .stage, .bottom-nav, .modal-backdrop, .drawer-backdrop, .chapter-drawer {
        display: none !important;
      }
      #printBookContainer { display: block !important; }
      #printBookContainer .book-page {
        width: 5in !important;
        height: 8in !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        page-break-after: always;
        break-after: page;
      }
      #printBookContainer .book-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
