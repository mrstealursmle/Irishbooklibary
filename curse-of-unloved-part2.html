      spineInches: "0.12"
    };

    /* =========================================================================
       7. Assemble Physical Book with Automatic Recto Alignment & Dynamic Indexing
       ========================================================================= */
    function buildBookPages() {
      const formalTitle = bookMeta.displayTitle;
      const edParts = bookMeta.editionLabel.split(/[•|]/).map(s => s.trim()).filter(Boolean);
      const titleMarkTop = edParts[0] || "Private Written Title";
      const titleMarkSub = edParts.length > 1
        ? `${edParts.slice(1).join(" • ")} • 2026`
        : `${resolveBookToken()} • 2026`;

      // Reset dynamic page registry
      bookStats = {
        chapterStartPages: {},
        chapterRanges: [],
        piecePages: {},
        authorsNotePage: 0,
        quotesIndexPage: 0,
        aboutAuthorPage: 0,
        interiorPageCount: 0,
        signatureCount: 0,
        spineInches: "0.12"
      };

      /* --- PASS 1: Build Body Chapters & Back Matter to Resolve Exact Page Numbers --- */
      const bodyAndBackPages = [];
      let pageNum = 1;

      // Helper: Insert a quiet blank verso page whenever a recto-only opener
      // (Part Opener or Closing Note) would otherwise fall on a verso (even page).
      function ensureRecto(blankId) {
        if (pageNum % 2 === 0) {
          bodyAndBackPages.push({
            id: blankId,
            type: "interior",
            side: "verso",
            label: "Pause",
            render: () => `<div class="page-inner verso-gutter"></div>`
          });
          pageNum++;
        }
      }

      CHAPTERS.forEach((ch) => {
        ensureRecto(`blank-before-${ch.id}`);
        const startPage = pageNum;
        bookStats.chapterStartPages[ch.id] = startPage;

        // Chapter Opener (Always Recto / Odd, Running Header Suppressed)
        bodyAndBackPages.push(
          partOpenerPage(ch.id, ch.roman, ch.title, ch.subtitle, ch.sketch, pageNum)
        );
        pageNum++;

        // Chapter Entries (Poems & Prose)
        ch.entries.forEach((entry) => {
          const isRecto = pageNum % 2 === 1;
          const runningHead = isRecto ? ch.title : formalTitle;
          const piecePageId = `piece-${entry.key}`;
          bookStats.piecePages[entry.key] = { pageNum, pageId: piecePageId };

          if (entry.kind === "poem") {
            bodyAndBackPages.push(
              poemPage(piecePageId, entry.body, entry.tag, pageNum, runningHead, isRecto, entry.ghost)
            );
          } else if (entry.kind === "prose") {
            bodyAndBackPages.push(
              prosePage(piecePageId, entry.heading, entry.paragraphs, pageNum, runningHead, isRecto)
            );
          }
          pageNum++;
        });

        bookStats.chapterRanges.push({
          id: ch.id,
          start: startPage,
          end: pageNum - 1
        });
      });

      // Closing Note ("A Quiet Note to the Reader") — Always Recto (Odd / Right Page)
      ensureRecto("blank-before-authors-note");
      bookStats.authorsNotePage = pageNum;
      bodyAndBackPages.push({
        id: "authors-note",
        type: "interior",
        side: "recto",
        label: `Page ${pageNum}`,
        render: () => `
          <div class="page-inner recto-gutter">
            <div class="prose-wrap">
              <h3 class="prose-heading">A Quiet Note to the Reader</h3>
              <div class="prose-text has-dropcap">
                <p>This second volume was written without armor and without excuses&mdash;for anyone tired of keeping score in quiet rooms, and finally ready to come home to themselves.</p>
                <p>You do not have to harden your heart to protect it. Put down the unrequested ledger, turn off the porch light at a reasonable hour, and save your steadiness for hands that actually know how to hold what they are given.</p>
              </div>
              <div class="prose-sign">&mdash; ${escapeHTML(bookMeta.authorShort)}</div>
            </div>
            <div class="page-footer-num">${bookStats.authorsNotePage}</div>
          </div>`
      });
      pageNum++;

      // Clickable "Lines Kept in the Margin" Index (Verso / Even Page)
      bookStats.quotesIndexPage = pageNum;
      bodyAndBackPages.push({
        id: "quotes-index",
        type: "interior",
        side: "verso",
        label: `Page ${pageNum}`,
        render: () => {
          const rows = MARGIN_HIGHLIGHTS.map(q => {
            const loc = bookStats.piecePages[q.pieceKey] || { pageNum: 1, pageId: "part-1" };
            return `
              <li class="margin-item" onclick="goToPageId('${loc.pageId}')">
                <span class="margin-line">&ldquo;${escapeHTML(q.text)}&rdquo;</span>
                <span class="margin-meta"><span>${q.part}</span><span>p. ${loc.pageNum}</span></span>
              </li>`;
          }).join("");

          return `
            <div class="page-inner verso-gutter">
              <div class="margin-index-wrap">
                <h3 class="margin-heading">Lines Kept in the Margin</h3>
                <ul class="margin-list">${rows}</ul>
              </div>
              <div class="page-footer-num">${bookStats.quotesIndexPage}</div>
            </div>`;
        }
      });
      pageNum++;

      // About Irish (Recto / Odd Page)
      bookStats.aboutAuthorPage = pageNum;
      bodyAndBackPages.push({
        id: "about-author",
        type: "interior",
        side: "recto",
        label: `Page ${pageNum}`,
        render: () => `
          <div class="page-inner recto-gutter">
            <div class="about-wrap">
              <div class="about-monogram">${escapeHTML(bookMeta.authorShort.charAt(0).toUpperCase())}</div>
              <h3 class="about-heading">About ${escapeHTML(bookMeta.authorShort)}</h3>
              <div class="about-text">
                <p><strong>${escapeHTML(bookMeta.authorShort)}</strong> writes spare, unsentimental verse and midnight prose examining one-sided devotion, the quiet ego of over-giving, and the ordinary rooms where heartbreak actually lives.</p>
                <p><em>${escapeHTML(formalTitle)}</em> is the second private written volume&mdash;authored without commercial imprints or easy consolation, kept for readers ready for clarity over comfort.</p>
              </div>
            </div>
            <div class="page-footer-num">${bookStats.aboutAuthorPage}</div>
          </div>`
      });
      pageNum++;

      // Exact Interior Page Count (8 Front Matter + Body/Back including Verso Colophon)
      const frontMatterCount = 8;
      bookStats.interiorPageCount = frontMatterCount + bodyAndBackPages.length + 1;
      bookStats.signatureCount = Math.ceil(bookStats.interiorPageCount / 4);
      bookStats.spineInches = (bookStats.interiorPageCount * 0.0025 + 0.02).toFixed(2);

      // Private Archival Colophon (Verso, Unnumbered — faces Inside Back Endpaper)
      bodyAndBackPages.push({
        id: "colophon",
        type: "interior",
        side: "verso",
        label: "Colophon",
        render: () => `
          <div class="page-inner verso-gutter">
            <div class="colophon-wrap">
              <div class="colophon-sprig" style="margin-bottom:calc(var(--page-h) * 0.022);opacity:0.74;">${sketches.tinyArchMotif}</div>
              This is a Private Written Edition,<br/>
              authored without commercial imprint for quiet reading and private keeping.<br/><br/>
              Typeset in EB Garamond, Cormorant Garamond &amp; Cinzel,<br/>
              across ${bookStats.interiorPageCount} archival pages in 5 &times; 8 in trade book format.<br/><br/>
              ${escapeHTML(bookMeta.editionLabel)} &bull; 2026
            </div>
          </div>`
      });

      /* --- PASS 2: Assemble Complete Physical Book Array --- */
      const list = [];

      // 0: Front Cover (Alone)
      list.push({
        id: "front-cover",
        type: "cover-front",
        label: "Front Cover",
        render: (uid = "main") => renderFrontCoverInner(uid)
      });

      // 1 (Left / Verso): Inside Front Cover Endpaper
      list.push({
        id: "inside-front",
        type: "endpaper",
        label: "Inside Cover",
        render: () => `<div class="endpaper-inner"></div>`
      });

      // 2 (Right / Recto): Half Title
      list.push({
        id: "half-title",
        type: "interior",
        side: "recto",
        label: "Half Title",
        render: () => `
          <div class="page-inner recto-gutter">
            <div class="half-title-wrap">
              <div class="half-title-text">${escapeHTML(formalTitle)}</div>
            </div>
          </div>`
      });

      // 3 (Left / Verso): Frontispiece Minimalist Ink Lamp/Doorway Ornament
      list.push({
        id: "frontispiece",
        type: "interior",
        side: "verso",
        label: "Frontispiece",
        render: () => `
          <div class="page-inner verso-gutter" style="justify-content:center;align-items:center;opacity:0.58;">
            <div class="full-title-sprig">${sketches.tinyArchMotif}</div>
          </div>`
      });

      // 4 (Right / Recto): Full Title Page (Strictly Private Written, Zero Publisher)
      list.push({
        id: "title-page",
        type: "interior",
        side: "recto",
        label: "Title Page",
        render: () => `
          <div class="page-inner recto-gutter">
            <div class="full-title-wrap">
              <div>
                <div class="full-title-main">${escapeHTML(formalTitle)}</div>
                <div class="full-title-sub">${escapeHTML(bookMeta.subtitle)}</div>
              </div>
              <div class="full-title-sprig" style="opacity:0.86;">${sketches.tinyArchMotif}</div>
              <div class="full-title-author">${escapeHTML(bookMeta.authorCredit)}</div>
              <div class="full-title-manuscript-mark">
                <span class="ms-mark-top">${escapeHTML(titleMarkTop)}</span>
                <span class="ms-mark-sub">${escapeHTML(titleMarkSub)}</span>
              </div>
            </div>
          </div>`
      });

      // 5 (Left / Verso): Private Written Notice (No Publisher, No ISBN)
      list.push({
        id: "copyright",
        type: "interior",
        side: "verso",
        label: "Private Notice",
        render: () => `
          <div class="page-inner verso-gutter">
            <div class="copyright-wrap">
              <div class="copyright-kicker">Private Written Notice</div>
              <p class="copyright-title">${escapeHTML(formalTitle)}</p>
              <p>Written &copy; 2026 by ${escapeHTML(bookMeta.authorShort)}. All words privately authored and preserved.</p>
              <p>Second private volume &mdash; unpublished personal manuscript. Crafted for quiet reading without commercial imprints or publisher marks.</p>
              <p>Typeset in EB Garamond, Cormorant Garamond &amp; Cinzel &bull; 5 &times; 8 in Book Format (${bookStats.interiorPageCount} interior pages).</p>
            </div>
          </div>`
      });

      // 6 (Right / Recto): Dedication
      list.push({
        id: "dedication",
        type: "interior",
        side: "recto",
        label: "Dedication",
        render: () => `
          <div class="page-inner recto-gutter">
            <div class="dedication-wrap">
              <div class="dedication-text">${escapeHTML(bookMeta.dedication).replace(/\n/g, "<br/>")}</div>
            </div>
          </div>`
      });

      // 7 (Left / Verso): Intentional Blank Verso so Contents Lands on Recto
      list.push({
        id: "blank-pre-toc",
        type: "interior",
        side: "verso",
        label: "Blank",
        render: () => `<div class="page-inner verso-gutter"></div>`
      });

      // 8 (Right / Recto): Interactive Table of Contents (Dynamic Page Numbers)
      list.push({
        id: "contents",
        type: "interior",
        side: "recto",
        label: "Contents",
        render: () => {
          const itemsHTML = CHAPTERS.map(ch => `
            <li class="toc-item" onclick="goToPageId('${ch.id}')">
              <div>
                <span class="toc-part-num">${ch.roman}</span>
                <span class="toc-part-title">${escapeHTML(ch.title)}</span>
              </div>
              <span class="toc-dots"></span>
              <span class="toc-pg">${bookStats.chapterStartPages[ch.id]}</span>
            </li>
          `).join("");

          return `
            <div class="page-inner recto-gutter">
              <div class="toc-wrap">
                <h2 class="toc-heading">Contents</h2>
                <ul class="toc-list">
                  ${itemsHTML}
                  <li class="toc-item" onclick="goToPageId('authors-note')">
                    <div>
                      <span class="toc-part-num">Closing</span>
                      <span class="toc-part-title">A Quiet Note to the Reader</span>
                    </div>
                    <span class="toc-dots"></span>
                    <span class="toc-pg">${bookStats.authorsNotePage}</span>
                  </li>
                  <li class="toc-item" onclick="goToPageId('quotes-index')">
                    <div>
                      <span class="toc-part-num">Index</span>
                      <span class="toc-part-title">Lines Kept in the Margin</span>
                    </div>
                    <span class="toc-dots"></span>
                    <span class="toc-pg">${bookStats.quotesIndexPage}</span>
                  </li>
                  <li class="toc-item" onclick="goToPageId('about-author')">
                    <div>
                      <span class="toc-part-num">Author</span>
                      <span class="toc-part-title">About ${escapeHTML(bookMeta.authorShort)}</span>
                    </div>
                    <span class="toc-dots"></span>
                    <span class="toc-pg">${bookStats.aboutAuthorPage}</span>
                  </li>
                </ul>
              </div>
            </div>`;
        }
      });

      // 9 (Left / Verso): Epigraph Facing Part I (Page 1)
      list.push({
        id: "epigraph",
        type: "interior",
        side: "verso",
        label: "Epigraph",
        render: () => `
          <div class="page-inner verso-gutter">
            <div class="dedication-wrap">
              <div class="dedication-text">
                &ldquo;This is not a monument to how badly they treated me.<br/>
                It is an honest account of how long I stayed<br/>
                after the door was already open.&rdquo;
              </div>
              <div class="epigraph-author">&mdash; ${escapeHTML(bookMeta.authorShort)}</div>
            </div>
          </div>`
      });

      // Append all 4 Movements + Back Matter
      bodyAndBackPages.forEach(p => list.push(p));

      // Inside Back Cover Endpaper (Right / Recto facing Verso Colophon)
      list.push({
        id: "inside-back",
        type: "endpaper",
        label: "Inside Back Cover",
        render: () => `<div class="endpaper-inner"></div>`
      });

      // Final Slot: Back Cover (Alone)
      list.push({
        id: "back-cover",
        type: "cover-back",
        label: "Back Cover",
        render: (uid = "main") => renderBackCoverInner(uid)
      });

      return list;
    }

    /* =========================================================================
       8. Editorial Interior Page Template Builders
       ========================================================================= */
    function partOpenerPage(id, roman, title, sub, sketch, pageNum) {
      return {
        id,
        type: "interior",
        side: "recto",
        chapterId: id,
        pageNum,
        label: `Page ${pageNum}`,
        render: () => `
          <div class="page-inner recto-gutter">
            <div class="part-opener-wrap">
              <div class="part-sketch">${sketch}</div>
              <div class="part-roman">${roman}</div>
              <h2 class="part-name">${escapeHTML(title)}</h2>
              <p class="part-sub">${escapeHTML(sub)}</p>
            </div>
            <div class="page-footer-num">${pageNum}</div>
          </div>`
      };
    }

    function poemPage(id, body, tag, pageNum, runningHead, isRecto, ghostText = "") {
      const gutterCls = isRecto ? "recto-gutter" : "verso-gutter";
      return {
        id,
        type: "interior",
        side: isRecto ? "recto" : "verso",
        pageNum,
        label: `Page ${pageNum}`,
        render: () => `
          <div class="page-inner ${gutterCls}">
            ${ghostText ? `<div class="ghost-bleed" aria-hidden="true">${escapeHTML(ghostText)}</div>` : ""}
            <div class="running-header">${escapeHTML(runningHead)}</div>
            <div class="poem-wrap">
              <div class="poem-body">${escapeHTML(body)}</div>
              <div class="poem-title-tag">&mdash; ${escapeHTML(tag)}</div>
            </div>
            <div class="page-footer-num">${pageNum}</div>
          </div>`
      };
    }

    function prosePage(id, heading, paragraphs, pageNum, runningHead, isRecto) {
      const gutterCls = isRecto ? "recto-gutter" : "verso-gutter";
      const pHtml = paragraphs.map(p => `<p>${escapeHTML(p)}</p>`).join("");
      return {
        id,
        type: "interior",
        side: isRecto ? "recto" : "verso",
        pageNum,
        label: `Page ${pageNum}`,
        render: () => `
          <div class="page-inner ${gutterCls}">
            <div class="running-header">${escapeHTML(runningHead)}</div>
            <div class="prose-wrap">
              <h3 class="prose-heading">${escapeHTML(heading)}</h3>
              <div class="prose-text has-dropcap">${pHtml}</div>
              <div class="poem-tiny-ornament">${sketches.tinyArchMotif}</div>
            </div>
            <div class="page-footer-num">${pageNum}</div>
          </div>`
      };
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /* =========================================================================
       9. Interactive Reader Engine (Single-Page Mobile + 2-Page Desktop Spread)
       ========================================================================= */
    let pages = buildBookPages();
    let isSpreadMode = window.innerWidth > 900;
    let currentIndex = 0;
    let currentStep = 0;
    let isAnimating = false;

    function buildSteps() {
      if (!isSpreadMode) return pages.map((_, idx) => [idx]);
      const steps = [[0]]; // Front cover alone
      for (let i = 1; i < pages.length - 1; i += 2) {
        steps.push(i + 1 < pages.length - 1 ? [i, i + 1] : [i]);
      }
      steps.push([pages.length - 1]); // Back cover alone
      return steps;
    }

    function findStepForPage(pageIdx) {
      const idx = buildSteps().findIndex(s => s.includes(pageIdx));
      return idx >= 0 ? idx : 0;
    }

    function renderBook(direction = null) {
      try {
        const steps = buildSteps();
        currentStep = Math.max(0, Math.min(currentStep, steps.length - 1));
        const stage = document.getElementById("bookStage");

        const applyRender = () => {
          const pair = steps[currentStep];
          currentIndex = pair[0];
          const isPairSpread = pair.length === 2;
          stage.classList.toggle("is-spread", isPairSpread);

          let html = "";
          if (!isPairSpread) {
            const p = pages[pair[0]];
            let cls = "book-page single-page";
            if (p.type === "cover-front") cls = "book-page cover-front";
            if (p.type === "cover-back") cls = "book-page cover-back";
            html = `
              <div class="${cls}">
                ${p.render("main")}
                <div class="flip-zone left" onclick="prevStep()" title="Previous page"></div>
                <div class="flip-zone right" onclick="nextStep()" title="Next page"></div>
              </div>`;
          } else {
            const leftP = pages[pair[0]];
            const rightP = pages[pair[1]];
            html = `
              <div class="book-page spread-left">
                ${leftP.render("mainL")}
                <div class="flip-zone left" onclick="prevStep()" title="Previous spread"></div>
              </div>
              <div class="book-page spread-right">
                ${rightP.render("mainR")}
                <div class="flip-zone right" onclick="nextStep()" title="Next spread"></div>
              </div>`;
          }
          stage.innerHTML = html;
          updateUIState(steps, pair);
        };

        if (direction) {
          if (isAnimating) return;
          isAnimating = true;
          stage.classList.add(direction === "next" ? "turning-next" : "turning-prev");
          setTimeout(() => {
            applyRender();
            stage.classList.remove("turning-next", "turning-prev");
            isAnimating = false;
          }, 160);
        } else {
          applyRender();
        }
      } catch (err) {
        console.error("Failed to render book stage:", err);
      }
    }

    function resolveActiveSectionIds(pair) {
      const ids = pair.map(i => pages[i].id);
      pair.forEach(i => {
        const p = pages[i];
        if (p && typeof p.pageNum === "number") {
          const range = bookStats.chapterRanges.find(
            r => p.pageNum >= r.start && p.pageNum <= r.end
          );
          if (range && !ids.includes(range.id)) ids.push(range.id);
        }
      });
      return ids;
    }

    function updateUIState(steps, pair) {
      document.getElementById("prevBtn").disabled = currentStep === 0;
      document.getElementById("nextBtn").disabled = currentStep === steps.length - 1;
      document.getElementById("pageIndicator").textContent =
        pair.length === 1
          ? pages[pair[0]].label
          : `${pages[pair[0]].label}  ·  ${pages[pair[1]].label}`;

      const ids = resolveActiveSectionIds(pair);
      document.getElementById("btnFrontCover").classList.toggle("active", ids.includes("front-cover"));
      document.getElementById("btnContents").classList.toggle("active", ids.includes("contents"));
      document.getElementById("btnBackCover").classList.toggle("active", ids.includes("back-cover"));
      document.getElementById("btnViewMode").textContent = isSpreadMode ? "Single Page" : "Spread View";
      renderChapterDrawer(ids);
    }

    function nextStep() {
      const steps = buildSteps();
      if (currentStep < steps.length - 1) {
        currentStep++;
        renderBook("next");
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderBook("prev");
      }
    }

    function goToPageId(id) {
      const pageIdx = pages.findIndex(p => p.id === id);
      if (pageIdx < 0) return;
      const targetStep = findStepForPage(pageIdx);
      const dir = targetStep > currentStep ? "next" : (targetStep < currentStep ? "prev" : null);
      currentStep = targetStep;
      closeChapterDrawer();
      renderBook(dir);
    }

    function toggleViewMode() {
      if (window.innerWidth <= 900) return;
      isSpreadMode = !isSpreadMode;
      currentStep = findStepForPage(currentIndex);
      renderBook();
    }

    function toggleNightMode() {
      document.body.classList.toggle("night-mode");
      document.getElementById("btnNightMode").classList.toggle(
        "active",
        document.body.classList.contains("night-mode")
      );
    }

    /* =========================================================================
       10. Slide-Out Chapter & Section Index Drawer (Dynamically Indexed)
       ========================================================================= */
    function renderChapterDrawer(activeIds = []) {
      const body = document.getElementById("drawerBody");
      const chapterItems = CHAPTERS.map(ch => `
        <button class="drawer-item ${activeIds.includes(ch.id) ? "active" : ""}" onclick="goToPageId('${ch.id}')">
          <span>
            <span class="drawer-item-title">${ch.roman}: ${escapeHTML(ch.title)}</span>
            <span class="drawer-item-sub">${escapeHTML(ch.subtitle)}</span>
          </span>
          <span class="drawer-item-pg">p. ${bookStats.chapterStartPages[ch.id]}</span>
        </button>
      `).join("");

      body.innerHTML = `
        <div class="drawer-group-label">Front Matter</div>
        <button class="drawer-item ${activeIds.includes("front-cover") ? "active" : ""}" onclick="goToPageId('front-cover')">
          <span class="drawer-item-title">Front Cover</span>
          <span class="drawer-item-pg">Cover</span>
        </button>
        <button class="drawer-item ${activeIds.includes("title-page") ? "active" : ""}" onclick="goToPageId('title-page')">
          <span class="drawer-item-title">Title &amp; Private Notice</span>
          <span class="drawer-item-pg">iii</span>
        </button>
        <button class="drawer-item ${activeIds.includes("contents") ? "active" : ""}" onclick="goToPageId('contents')">
          <span class="drawer-item-title">Table of Contents</span>
          <span class="drawer-item-pg">vii</span>
        </button>

        <div class="drawer-group-label">Four Movements (22 Pieces)</div>
        ${chapterItems}

        <div class="drawer-group-label">Closing &amp; Keepsake Pages</div>
        <button class="drawer-item ${activeIds.includes("authors-note") ? "active" : ""}" onclick="goToPageId('authors-note')">
          <span class="drawer-item-title">A Quiet Note to the Reader</span>
          <span class="drawer-item-pg">p. ${bookStats.authorsNotePage}</span>
        </button>
        <button class="drawer-item ${activeIds.includes("quotes-index") ? "active" : ""}" onclick="goToPageId('quotes-index')">
          <span class="drawer-item-title">Lines Kept in the Margin</span>
          <span class="drawer-item-pg">p. ${bookStats.quotesIndexPage}</span>
        </button>
        <button class="drawer-item ${activeIds.includes("about-author") ? "active" : ""}" onclick="goToPageId('about-author')">
          <span class="drawer-item-title">About ${escapeHTML(bookMeta.authorShort)} &amp; Colophon</span>
          <span class="drawer-item-pg">p. ${bookStats.aboutAuthorPage}</span>
        </button>
        <button class="drawer-item ${activeIds.includes("back-cover") ? "active" : ""}" onclick="goToPageId('back-cover')">
          <span class="drawer-item-title">Back Cover &amp; Private Seal</span>
          <span class="drawer-item-pg">Back</span>
        </button>
        <button class="drawer-item" onclick="closeChapterDrawer(); openFullWrap();">
          <span class="drawer-item-title">Full-Wrap Cover Inspector</span>
          <span class="drawer-item-pg">Wrap</span>
        </button>
      `;
    }

    function toggleChapterDrawer() {
      const drawer = document.getElementById("chapterDrawer");
      const open = !drawer.classList.contains("open");
      drawer.classList.toggle("open", open);
      document.getElementById("drawerBackdrop").classList.toggle("open", open);
      document.getElementById("btnChapters").classList.toggle("active", open);
    }

    function closeChapterDrawer() {
      document.getElementById("chapterDrawer").classList.remove("open");
      document.getElementById("drawerBackdrop").classList.remove("open");
      document.getElementById("btnChapters").classList.remove("active");
    }

    /* =========================================================================
       11. Full-Wrap Private Book Cover Inspector (Back + Spine + Front + Bleed)
       ========================================================================= */
    function renderFullWrap() {
      const specsEl = document.getElementById("wrapSpecsLine");
      const totalWrapWidth = (10 + parseFloat(bookStats.spineInches) + 0.25).toFixed(2);
      specsEl.innerHTML = `5.00&Prime; &times; 8.00&Prime; Trim &bull; ${bookStats.interiorPageCount} Interior Pages (${bookStats.signatureCount} &times; 4p Signatures) &bull; ${bookStats.spineInches}&Prime; Spine &bull; ${totalWrapWidth}&Prime; &times; 8.25&Prime; w/ 0.125&Prime; Bleed`;

      const sheet = document.getElementById("fullWrapSheet");
      sheet.innerHTML = `
        <div class="wrap-panel-back">
          ${renderBackCoverInner("wrap")}
        </div>
        <div class="wrap-panel-spine">
          <div class="spine-title">${escapeHTML(bookMeta.displayTitle)}</div>
          <div class="spine-author">${escapeHTML(bookMeta.authorShort.toUpperCase())}</div>
          <div class="spine-sprig">${sketches.spineArchIcon}</div>
        </div>
        <div class="wrap-panel-front">
          ${renderFrontCoverInner("wrap")}
        </div>
        <div class="bleed-guides-overlay">
          <div class="guide-trim-box"></div>
          <div class="guide-safe-left"></div>
          <div class="guide-safe-right"></div>
          <div class="guide-spine-fold"></div>
          <span class="guide-badge trim">0.125&Prime; BLEED / TRIM</span>
          <span class="guide-badge safe">0.25&Prime; SAFE ZONE</span>
          <span class="guide-badge spine">${bookStats.spineInches}&Prime; SPINE</span>
        </div>
      `;
      toggleBleedOverlay();
    }

    function openFullWrap() {
      renderFullWrap();
      document.getElementById("fullWrapModal").classList.add("open");
    }

    function closeFullWrap() {
      document.getElementById("fullWrapModal").classList.remove("open");
    }

    function toggleBleedOverlay() {
      const checked = document.getElementById("toggleBleedGuides").checked;
      document.getElementById("fullWrapSheet").classList.toggle("show-guides", checked);
    }

    /* =========================================================================
       12. Live Customization Modal & 5x8 Print / Save as PDF Export
       ========================================================================= */
    function openPersonalize() {
      document.getElementById("inputCoverTitle").value = bookMeta.coverTitleLines.join(" / ");
      document.getElementById("inputPartLabel").value = bookMeta.partLabel;
      document.getElementById("inputDisplayTitle").value = bookMeta.displayTitle;
      document.getElementById("inputSubtitle").value = bookMeta.subtitle;
      document.getElementById("inputAuthor").value = bookMeta.authorCredit;
      document.getElementById("inputEditionLabel").value = bookMeta.editionLabel;
      document.getElementById("inputDedication").value = bookMeta.dedication;
      document.getElementById("personalizeModal").classList.add("open");
    }

    function closePersonalize() {
      document.getElementById("personalizeModal").classList.remove("open");
    }

    function savePersonalize() {
      try {
        const lines = document.getElementById("inputCoverTitle").value
          .split("/")
          .map(s => s.trim())
          .filter(Boolean);
        bookMeta.coverTitleLines = lines.length ? lines : ["The Curse", "of the", "Unloved"];
        bookMeta.partLabel = document.getElementById("inputPartLabel").value.trim() || "Part II";
        bookMeta.displayTitle = document.getElementById("inputDisplayTitle").value.trim() || `${bookMeta.coverTitleLines.join(" ")}: ${bookMeta.partLabel}`;
        bookMeta.subtitle = document.getElementById("inputSubtitle").value.trim() || bookMeta.subtitle;
        bookMeta.authorCredit = document.getElementById("inputAuthor").value.trim() || "Written by Irish";
        bookMeta.authorShort = bookMeta.authorCredit.replace(/^written\s+by\s+/i, "").trim() || "Irish";
        bookMeta.editionLabel = document.getElementById("inputEditionLabel").value.trim() || "Private Written Title • Book II";
        bookMeta.dedication = document.getElementById("inputDedication").value.trim() || bookMeta.dedication;

        pages = buildBookPages();
        document.title = `${bookMeta.displayTitle} — ${bookMeta.authorCredit}`;
        closePersonalize();
        renderBook();
        if (document.getElementById("fullWrapModal").classList.contains("open")) {
          renderFullWrap();
        }
      } catch (err) {
        console.error("Failed to apply customization:", err);
      }
    }

    function printRealBook() {
      try {
        const container = document.getElementById("printBookContainer");
        container.innerHTML = pages.map((p, idx) => {
          let cls = "book-page";
          if (p.type === "cover-front") cls += " cover-front";
          else if (p.type === "cover-back") cls += " cover-back";
          return `<div class="${cls}">${p.render(`print_${idx}`)}</div>`;
        }).join("");
        window.print();
      } catch (err) {
        console.error("Print preparation failed:", err);
      }
    }

    /* =========================================================================
       13. Subtle Slow-Drifting Candlelit Gold Dust & Warm Ash Embers Canvas
       ========================================================================= */
    const emberCanvas = document.getElementById("emberCanvas");
    const emberCtx = emberCanvas.getContext("2d");
    let embersActive = true;
    let moteList = [];
    let ashList = [];
    let cW = window.innerWidth;
    let cH = window.innerHeight;

    function resizeEmberCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cW = window.innerWidth;
      cH = window.innerHeight;
      emberCanvas.width = cW * dpr;
      emberCanvas.height = cH * dpr;
      emberCanvas.style.width = `${cW}px`;
      emberCanvas.style.height = `${cH}px`;
      emberCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeGoldMote(randomY = false) {
      return {
        x: Math.random() * cW,
        y: randomY ? Math.random() * cH : cH + 14 + Math.random() * 50,
        r: 0.85 + Math.random() * 1.85,
        vy: -(0.11 + Math.random() * 0.22),
        vx: -0.08 + Math.random() * 0.16,
        swayAmp: 0.16 + Math.random() * 0.32,
        swayFreq: 0.004 + Math.random() * 0.007,
        phase: Math.random() * Math.PI * 2,
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.011 + Math.random() * 0.017,
        baseAlpha: 0.18 + Math.random() * 0.30
      };
    }

    function makeAshFleck(randomY = false) {
      return {
        x: Math.random() * cW,
        y: randomY ? Math.random() * cH : -14 - Math.random() * 50,
        w: 1.3 + Math.random() * 2.0,
        h: 0.7 + Math.random() * 1.2,
        vy: 0.13 + Math.random() * 0.20,
        vx: -0.09 + Math.random() * 0.18,
        rot: Math.random() * Math.PI * 2,
        vRot: -0.008 + Math.random() * 0.016,
        alpha: 0.11 + Math.random() * 0.16
      };
    }

    function seedEmbers() {
      moteList = [];
      ashList = [];
      for (let i = 0; i < 34; i++) moteList.push(makeGoldMote(true));
      for (let i = 0; i < 15; i++) ashList.push(makeAshFleck(true));
    }

    function drawGoldMote(m) {
      const isNight = document.body.classList.contains("night-mode");
      const alpha = m.baseAlpha * (0.55 + 0.45 * Math.sin(m.twinklePhase)) * (isNight ? 1.22 : 0.82);
      emberCtx.save();
      emberCtx.globalAlpha = Math.min(alpha, 0.66);

      const g = emberCtx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 3.1);
      g.addColorStop(0, isNight ? "rgba(255, 228, 174, 0.94)" : "rgba(205, 152, 78, 0.86)");
      g.addColorStop(0.45, isNight ? "rgba(223, 180, 112, 0.42)" : "rgba(176, 126, 68, 0.32)");
      g.addColorStop(1, "rgba(223, 180, 112, 0)");

      emberCtx.fillStyle = g;
      emberCtx.beginPath();
      emberCtx.arc(m.x, m.y, m.r * 3.1, 0, Math.PI * 2);
      emberCtx.fill();
      emberCtx.restore();
    }

    function drawAshFleck(a) {
      const isNight = document.body.classList.contains("night-mode");
      emberCtx.save();
      emberCtx.translate(a.x, a.y);
      emberCtx.rotate(a.rot);
      emberCtx.globalAlpha = a.alpha * (isNight ? 1.05 : 0.82);
      emberCtx.fillStyle = isNight ? "#9e8884" : "#5e4a47";
      emberCtx.beginPath();
      emberCtx.ellipse(0, 0, a.w, a.h, 0, 0, Math.PI * 2);
      emberCtx.fill();
      emberCtx.restore();
    }

    function animateEmbers() {
      emberCtx.clearRect(0, 0, cW, cH);

      if (embersActive) {
        for (let i = 0; i < moteList.length; i++) {
          const m = moteList[i];
          m.phase += m.swayFreq;
          m.twinklePhase += m.twinkleSpeed;
          m.x += m.vx + Math.sin(m.phase) * m.swayAmp;
          m.y += m.vy;

          if (m.y < -20 || m.x < -30 || m.x > cW + 30) {
            moteList[i] = makeGoldMote(false);
          }
          drawGoldMote(m);
        }

        for (let i = 0; i < ashList.length; i++) {
          const a = ashList[i];
          a.x += a.vx;
          a.y += a.vy;
          a.rot += a.vRot;

          if (a.y > cH + 20 || a.x < -30 || a.x > cW + 30) {
            ashList[i] = makeAshFleck(false);
          }
          drawAshFleck(a);
        }
      }

      requestAnimationFrame(animateEmbers);
    }

    function toggleEmbers() {
      embersActive = !embersActive;
      document.getElementById("btnEmbers").classList.toggle("active", embersActive);
    }

    /* =========================================================================
       14. Keyboard, Touch Swipe, Resize & Window Load Initialization
       ========================================================================= */
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closePersonalize();
        closeFullWrap();
        closeChapterDrawer();
        return;
      }
      if (
        document.getElementById("personalizeModal").classList.contains("open") ||
        document.getElementById("fullWrapModal").classList.contains("open")
      ) {
        return;
      }
      if (e.key === "ArrowRight") nextStep();
      if (e.key === "ArrowLeft") prevStep();
    });

    let touchStartX = 0;
    const wrapper = document.getElementById("bookWrapper");
    wrapper.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    wrapper.addEventListener("touchend", (e) => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 48) {
        diff > 0 ? nextStep() : prevStep();
      }
    }, { passive: true });

    window.addEventListener("resize", () => {
      resizeEmberCanvas();
      if (window.innerWidth <= 900 && isSpreadMode) {
        isSpreadMode = false;
        currentStep = findStepForPage(currentIndex);
        renderBook();
      }
    });

    window.onload = function () {
      resizeEmberCanvas();
      seedEmbers();
      renderBook();
      animateEmbers();
    };
  </script>
</body>
</html>
